<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEE Workbench</title>
  <meta name="description" content="JEE Workbench: practice and counselling for JEE Main and JEE Advanced.">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060912;
           font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: #e8eefc; }
    .card { max-width: 22rem; margin: 1rem; padding: 1.75rem; border-radius: 1rem; text-align: center;
            background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); }
    .dot { width: 2.75rem; height: 2.75rem; margin: 0 auto .9rem; border-radius: .9rem; display: grid; place-items: center;
           background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #060912; font-size: 1.3rem; font-weight: 800; }
    h1 { margin: 0 0 .3rem; font-size: 1.25rem; }
    p { margin: .3rem 0; color: #94a3c4; font-size: .95rem; }
    a { color: #67e8f9; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot">M</div>
    <h1>Opening JEE Workbench…</h1>
    <p id="msg">Taking you to the site.</p>
    <p><a id="go" href="#" hidden>Open JEE Workbench</a></p>
  </main>
  <script>
    // The site runs on a Cloudflare address that changes when it restarts; current.json always has the latest one.
    fetch("current.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        const url = new URL(d.url);
        if (!/\.trycloudflare\.com$/.test(url.hostname)) throw new Error("unexpected address");
        const target = url.origin + location.hash.replace(/^#/, "");  // e.g. .../portal/jee/#/predictor opens /predictor
        const go = document.getElementById("go");
        go.href = target; go.hidden = false;
        location.replace(target);
      })
      .catch(() => {
        document.getElementById("msg").textContent = "The site is offline right now. Please try again in a few minutes.";
      });
  </script>
</body>
</html>

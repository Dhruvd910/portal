<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekurious — Aspirant Hub</title>
<meta name="description" content="Tekurious Aspirant Hub: one doorway to every exam platform — NEET Compass and JEE Workbench.">
<link rel="icon" type="image/svg+xml" href="tekurious.svg">
<style>
  :root {
    --navy: #142B3F;
    --navy-deep: #0C1A2A;
    --green: #4CAF50;
    --green-soft: #7BD389;
    --panel: rgba(255, 255, 255, .045);
    --border: rgba(255, 255, 255, .10);
    --text: #e6eef5;
    --muted: #93a5b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(76, 175, 80, .10), transparent 60%),
      radial-gradient(900px 500px at 5% 110%, rgba(76, 175, 80, .07), transparent 60%),
      var(--navy-deep);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; padding: 60px 20px 20px; }
  .brandlink { text-decoration: none; display: block; }
  .logo {
    display: block;
    width: 84px; height: 84px;
    margin: 0 auto 16px;
    padding: 12px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 24px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .08);
    transition: transform .18s ease;
  }
  .brandlink:hover .logo { transform: scale(1.06); }
  .brand {
    display: block;
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--green-soft);
    margin-bottom: 14px;
  }
  .kicker {
    display: inline-block;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 16px;
    margin: 14px 0 20px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--green), var(--green-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--muted); margin-top: 12px; font-size: 1.05rem; }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 28px;
    max-width: 880px;
    width: 100%;
    margin: 44px auto;
    padding: 0 24px;
    align-items: stretch;
  }
  a.card {
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 34px 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  a.card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--c1), var(--c2));
  }
  a.card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--c1) 45%, transparent);
    box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--c1) 35%, transparent);
  }
  .emoji { font-size: 2.4rem; }
  .field {
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--c1) 80%, white);
    font-weight: 700;
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  .card .tagline { margin-top: 0; font-size: .95rem; }
  .card ul { list-style: none; margin-top: 6px; display: grid; gap: 8px; }
  .card li {
    color: var(--muted);
    font-size: .92rem;
    padding-left: 22px;
    position: relative;
  }
  .card li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--c1);
  }
  .enter {
    margin-top: auto;
    padding-top: 18px;
    font-weight: 700;
    font-size: .95rem;
    color: var(--c1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  a.card:hover .enter .arrow { transform: translateX(4px); }
  .enter .arrow { transition: transform .18s ease; display: inline-block; }

  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-size: .82rem;
    padding: 26px 20px 34px;
    text-align: center;
  }
  footer .logo-sm {
    width: 30px; height: 30px;
    padding: 4px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 8px;
  }
  footer b { color: var(--text); font-weight: 600; }
  .footerbrand { color: inherit; text-decoration: none; }
  .footerbrand:hover { color: var(--green-soft); }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
  }
</style>
</head>
<body>
<header>
  <a class="brandlink" href="https://tekurious.in" target="_blank" rel="noopener" title="tekurious.in">
    <img class="logo" src="tekurious.svg" alt="Tekurious logo">
    <div class="brand">Tekurious</div>
  </a>
  <span class="kicker">Aspirant Hub</span>
  <h1>Choose your <span class="grad">platform</span></h1>
  <p class="tagline" id="tagline"></p>
</header>

<main class="grid" id="grid"></main>

<footer>
  <img class="logo-sm" src="tekurious.svg" alt="">
  <span><a class="footerbrand" href="https://tekurious.in" target="_blank" rel="noopener"><b>Tekurious</b></a> · <span id="footer"></span></span>
</footer>

<script>
  fetch("platforms.json")
    .then(r => r.json())
    .then(cfg => {
      document.getElementById("tagline").textContent = cfg.site.tagline;
      document.getElementById("footer").textContent = cfg.site.footer;
      const grid = document.getElementById("grid");
      if (!cfg.platforms.length) {
        grid.innerHTML = '<p class="empty">No platforms configured yet.</p>';
        return;
      }
      for (const p of cfg.platforms) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.url;
        a.style.setProperty("--c1", p.accent);
        a.style.setProperty("--c2", p.accent2);
        a.innerHTML = `
          <span class="emoji">${p.emoji}</span>
          <span class="field">${p.field}</span>
          <h2>${p.name}</h2>
          <p class="tagline">${p.tagline}</p>
          <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <span class="enter">Open platform <span class="arrow">→</span></span>`;
        grid.appendChild(a);
      }
    })
    .catch(() => {
      document.getElementById("grid").innerHTML =
        '<p class="empty">Could not load platforms.json</p>';
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekurious — Aspirant Hub</title>
<meta name="description" content="Tekurious Aspirant Hub: one doorway to every exam platform — NEET Compass and JEE Workbench.">
<link rel="icon" type="image/svg+xml" href="tekurious.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #142B3F;
    --green: #4CAF50;
    --green-soft: #7BD389;
    --panel: rgba(255, 255, 255, .035);
    --border: rgba(255, 255, 255, .10);
    --text: #eaf1f8;
    --muted: #9fb0c3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 480px at -10% 108%, rgba(16, 185, 129, .22), transparent 65%),
      radial-gradient(800px 430px at 108% 104%, rgba(59, 130, 246, .20), transparent 65%),
      radial-gradient(700px 380px at 106% -12%, rgba(16, 185, 129, .12), transparent 60%),
      radial-gradient(620px 320px at -8% 42%, rgba(45, 212, 191, .07), transparent 60%),
      #0A1420;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ---------- decorative background ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-mono {
    position: absolute;
    top: -90px; right: -80px;
    width: 620px; height: 620px;
    opacity: .12;
    transform: rotate(8deg);
  }
  .dots {
    position: absolute;
    background-image: radial-gradient(rgba(255, 255, 255, .15) 1.6px, transparent 1.7px);
    background-size: 30px 30px;
  }
  .dots-1 { top: 70px; left: 250px; width: 230px; height: 165px; }
  .dots-2 { top: 56%; left: -10px; width: 165px; height: 230px; }
  .dots-3 { bottom: 8%; right: 12%; width: 165px; height: 120px; opacity: .6; }
  .wave {
    position: absolute;
    border-radius: 45%;
    filter: blur(2px);
  }
  .wave-green {
    bottom: -320px; left: -300px;
    width: 1000px; height: 560px;
    background: linear-gradient(120deg, rgba(16, 185, 129, .30), rgba(45, 212, 191, .05) 70%);
    transform: rotate(-8deg);
  }
  .wave-blue {
    bottom: -300px; right: -280px;
    width: 950px; height: 520px;
    background: linear-gradient(240deg, rgba(59, 130, 246, .28), rgba(37, 99, 235, .04) 70%);
    transform: rotate(7deg);
  }

  /* ---------- header ---------- */
  header { text-align: center; padding: 56px 20px 8px; }
  .brandlink { text-decoration: none; display: inline-block; }
  .logo {
    display: block;
    width: 68px; height: 68px;
    margin: 0 auto;
    padding: 9px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .10);
    transition: transform .18s ease;
  }
  .brandlink:hover .logo { transform: scale(1.06); }
  .brand {
    font-family: "Quicksand", ui-sans-serif, sans-serif;
    font-size: 1.06rem;
    font-weight: 700;
    letter-spacing: .48em;
    text-indent: .48em;
    text-transform: uppercase;
    color: var(--green);
    margin: 14px 0 4px;
  }
  .kicker {
    display: inline-block;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    margin: 10px 0 22px;
  }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  h1 .grad {
    background: linear-gradient(90deg, #22d3ee, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--muted); margin-top: 14px; font-size: 1.1rem; }
  .tagline a { color: var(--green-soft); text-decoration: none; }
  .tagline a:hover { text-decoration: underline; }
  .rule {
    width: 130px; height: 3px;
    margin: 20px auto 0;
    border-radius: 3px;
    background: linear-gradient(90deg, #22d3ee, #4ade80);
  }

  /* ---------- cards ---------- */
  /* circular carousel: the cards sit on a turning ring; the front one is full size, its neighbours
     turn away on either side, the rest wait behind. It loops forever (arrows, dots, swipe, keys, or tap a side card). */
  .carousel { flex: 1; position: relative; width: 100%; max-width: 1180px; margin: 36px auto; padding: 0 16px; overflow: hidden; }
  .grid {
    display: grid;  /* every card in the same cell, so the stage is as tall as the tallest card */
    place-items: center;
    perspective: 1400px;
    padding: 16px 0 30px;
  }
  .grid a.card {
    grid-area: 1 / 1;
    width: min(440px, 84vw);
    align-self: stretch;
    background-color: #0d1824;  /* solid under the glass, so cards behind don't show through */
    transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .6s ease, filter .6s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .grid a.card:not(.front) { cursor: pointer; filter: saturate(.75) brightness(.8); }  .navbtn {
    position: absolute; top: calc(50% - 40px); z-index: 50;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--border); background: rgba(255, 255, 255, .06); color: #e8eefc;
    font-size: 1.5rem; line-height: 1; cursor: pointer;
    transition: background .18s ease, opacity .18s ease;
  }
  .navbtn:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
  .navbtn:disabled { opacity: .25; cursor: default; }
  .navbtn.prev { left: 22px; } .navbtn.next { right: 22px; }
  .pager { display: flex; justify-content: center; gap: 10px; }
  .pager button {
    width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, .25); transition: width .2s ease, background .2s ease;
  }
  .pager button[aria-current="true"] { width: 28px; background: linear-gradient(90deg, #22d3ee, #4ade80); }
  :focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
  @media (max-width: 760px) { .navbtn { display: none; } }  /* swipe on phones */
  @media (prefers-reduced-motion: reduce) { .grid a.card { transition: none; } }
  a.card {
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 30px 30px 28px;
    border-radius: 22px;
    border: 1.5px solid color-mix(in srgb, var(--c1) 45%, transparent);
    background:
      radial-gradient(420px 190px at 100% 100%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 70%),
      linear-gradient(160deg, color-mix(in srgb, var(--c1) 9%, transparent), color-mix(in srgb, var(--c2) 5%, transparent) 60%, transparent),
      var(--panel);
    box-shadow: 0 20px 50px -20px color-mix(in srgb, var(--c1) 25%, transparent);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  a.card:hover {
    transform: translateY(-5px);
    border-color: color-mix(in srgb, var(--c1) 75%, transparent);
    box-shadow: 0 26px 60px -18px color-mix(in srgb, var(--c1) 40%, transparent);
  }
  .wm {
    position: absolute;
    top: -26px; right: -22px;
    width: 150px; height: 150px;
    color: color-mix(in srgb, var(--c1) 16%, transparent);
    pointer-events: none;
  }
  .wm svg { width: 100%; height: 100%; }
  .cardhead { display: flex; align-items: center; gap: 16px; }
  .appicon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px; height: 58px;
    font-size: 1.75rem;
    border-radius: 16px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 55%, white), var(--c1));
    box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--c1) 55%, transparent);
  }
  .pill {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--c1) 75%, white);
    border: 1px solid color-mix(in srgb, var(--c1) 45%, transparent);
    background: color-mix(in srgb, var(--c1) 10%, transparent);
    border-radius: 999px;
    padding: 8px 16px;
  }
  .card h2 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.01em; }
  .ctag { color: var(--muted); font-size: 1rem; }
  .card hr {
    border: none;
    border-top: 1px solid color-mix(in srgb, var(--c1) 22%, transparent);
    margin: 14px 0 6px;
  }
  .card ul { list-style: none; display: grid; gap: 13px; padding: 4px 0 8px; }
  .card li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #c6d3e2;
    font-size: .97rem;
  }
  .chk {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px; height: 21px;
    margin-top: 1px;
    border-radius: 50%;
    background: var(--c1);
    color: #06101c;
    font-size: .72rem;
    font-weight: 800;
  }
  .btn {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--c2), var(--c1));
    color: #07101d;
    font-weight: 800;
    font-size: 1rem;
    transition: filter .18s ease, transform .18s ease;
  }
  a.card:hover .btn { filter: brightness(1.1); }
  .btn .arrow { transition: transform .18s ease; }
  a.card:hover .btn .arrow { transform: translateX(4px); }

  /* ---------- footer ---------- */
  footer { display: flex; justify-content: center; padding: 8px 20px 34px; }
  .footerpill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: .85rem;
    background: rgba(255, 255, 255, .045);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 22px;
  }
  .logo-sm {
    width: 30px; height: 30px;
    padding: 4px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 9px;
  }
  .wordmark-sm {
    font-family: "Quicksand", ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: .98rem;
    color: var(--green-soft);
    text-decoration: none;
  }
  .wordmark-sm:hover { color: var(--green); }
  .sep { color: var(--green); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }

  /* One screen on every device: header, carousel and footer always fit, so the page never scrolls.
     Spacing and type scale with the screen height (vh); on short screens less important bits step aside (below). */
  @media all {
    body { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }  /* dvh: phones' moving address bar */
    header { padding: clamp(12px, 3.2vh, 56px) 20px 0; }
    .logo { width: clamp(44px, 6vh, 68px); height: clamp(44px, 6vh, 68px); padding: clamp(6px, .8vh, 9px); border-radius: 14px; }
    .brand { margin: clamp(6px, 1.2vh, 14px) 0 2px; }
    .kicker { margin: clamp(4px, .8vh, 10px) 0 clamp(6px, 1.6vh, 22px); padding: 6px 16px; }
    h1 { font-size: clamp(2rem, min(6vw, 6.4vh), 4rem); line-height: 1.1; }
    .tagline { margin-top: clamp(4px, 1vh, 14px); font-size: clamp(.95rem, 1.8vh, 1.1rem); }
    .rule { margin-top: clamp(8px, 1.6vh, 20px); }
    .carousel { flex: 1; min-height: 0; margin: clamp(6px, 1.6vh, 30px) auto 0; display: flex; flex-direction: column; justify-content: center; }
    .grid { padding: clamp(6px, 1.2vh, 16px) 0 clamp(10px, 2vh, 26px); }
    a.card { gap: clamp(6px, 1.1vh, 14px); padding: clamp(16px, 2.6vh, 30px) 28px clamp(16px, 2.4vh, 28px); }
    .appicon { width: clamp(42px, 5.6vh, 58px); height: clamp(42px, 5.6vh, 58px); font-size: clamp(1.3rem, 2.8vh, 1.75rem); }
    .card h2 { font-size: clamp(1.4rem, 3.2vh, 1.85rem); }
    .card hr { margin: clamp(4px, 1vh, 14px) 0 2px; }
    .card ul { gap: clamp(6px, 1.2vh, 13px); padding: 2px 0 clamp(4px, .8vh, 8px); }
    .btn { padding: clamp(10px, 1.4vh, 14px) 20px; }
    footer { padding: 6px 20px clamp(10px, 2.2vh, 34px); }
  }
  /* phones (portrait): smaller type and tighter cards */
  @media (max-width: 760px) {
    h1 { font-size: clamp(1.7rem, min(8.6vw, 5.4vh), 2.6rem); }
    .brand { font-size: .9rem; letter-spacing: .38em; text-indent: .38em; }
    .tagline { font-size: .9rem; padding: 0 8px; }
    a.card { padding: clamp(14px, 2.2vh, 24px) 20px; }
    .card h2 { font-size: clamp(1.25rem, 3vh, 1.6rem); }
    .ctag, .card li { font-size: .88rem; }
    .pill { padding: 6px 12px; font-size: .66rem; }
    .wm { width: 110px; height: 110px; }
    .footerpill { font-size: .75rem; padding: 8px 16px; }
  }
  @media (max-width: 480px) { .footerpill .sep, #footer { display: none; } }  /* just the Tekurious mark */
  @media (max-width: 480px) and (max-height: 600px) {  /* tiny phones */
    .tagline { display: none; }
    .card li, .ctag { font-size: .8rem; }
    .card ul { gap: 5px; }
  }
  /* short screens (small phones, phones held sideways, small laptop windows): drop the extras, keep every card's essentials */
  @media (max-height: 700px) { .kicker, .rule { display: none; } .brand { margin-bottom: 6px; } }
  @media (max-height: 560px) {
    .card hr, .card ul, .tagline { display: none; }
    .logo { width: 36px; height: 36px; padding: 4px; border-radius: 10px; }
    .brand { display: none; }
  }
  @media (max-height: 420px) {
    .brandlink, footer { display: none; }
    h1 { font-size: clamp(1.4rem, 8vh, 2rem); }
  }

  @media (max-width: 640px) {
    .dots-1, .dots-3 { display: none; }
    .bg-mono { width: 420px; height: 420px; opacity: .08; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <img class="bg-mono" src="tekurious.svg" alt="">
  <div class="dots dots-1"></div>
  <div class="dots dots-2"></div>
  <div class="dots dots-3"></div>
  <div class="wave wave-green"></div>
  <div class="wave wave-blue"></div>
</div>

<header>
  <a class="brandlink" href="https://tekurious.in" target="_blank" rel="noopener" title="tekurious.in">
    <img class="logo" src="tekurious.svg" alt="Tekurious logo">
    <div class="brand">Tekurious</div>
  </a>
  <span class="kicker">Aspirant Hub</span>
  <h1>Choose your <span class="grad">platform</span></h1>
  <p class="tagline">One doorway to every exam platform, by <a href="https://tekurious.in" target="_blank" rel="noopener">Tekurious</a></p>
  <div class="rule"></div>
</header>

<main class="carousel" aria-roledescription="carousel" aria-label="Platforms">
  <button class="navbtn prev" id="prev" type="button" aria-label="Previous platforms">‹</button>
  <div class="grid" id="grid"></div>
  <button class="navbtn next" id="next" type="button" aria-label="Next platforms">›</button>
  <div class="pager" id="pager"></div>
</main>

<footer>
  <span class="footerpill">
    <img class="logo-sm" src="tekurious.svg" alt="">
    <a class="wordmark-sm" href="https://tekurious.in" target="_blank" rel="noopener">Tekurious</a>
    <span class="sep">•</span>
    <span id="footer"></span>
    <span class="sep">•</span>
    <a class="wordmark-sm" href="papers.html">📄 Question papers</a>
  </span>
</footer>

<script>
  const WATERMARKS = {
    cross: '<svg viewBox="0 0 100 100" fill="currentColor"><path d="M35 4 h30 a3 3 0 0 1 3 3 v25 h25 a3 3 0 0 1 3 3 v30 a3 3 0 0 1 -3 3 h-25 v25 a3 3 0 0 1 -3 3 h-30 a3 3 0 0 1 -3 -3 v-25 h-25 a3 3 0 0 1 -3 -3 v-30 a3 3 0 0 1 3 -3 h25 v-25 a3 3 0 0 1 3 -3 z"/></svg>',
    gear: '<svg viewBox="0 0 100 100" fill="currentColor"><g>' +
      [0,45,90,135,180,225,270,315].map(a =>
        '<rect x="44" y="2" width="12" height="26" rx="4" transform="rotate(' + a + ' 50 50)"/>' ).join("") +
      '</g><circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width="15"/></svg>',
    board: '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="8" y="12" width="84" height="56" rx="5"/><path d="M30 68 L22 94 M70 68 L78 94 M50 4 v8"/>' +
      '<path d="M20 50 q8 -22 16 -6 t16 -8 t16 4" /><path d="M66 26 h14"/></svg>',
    bot: '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="16" y="28" width="68" height="52" rx="14"/><path d="M50 28 v-12 M8 50 v12 M92 50 v12 M38 66 h24"/>' +
      '<circle cx="50" cy="12" r="4" fill="currentColor"/><circle cx="37" cy="50" r="5" fill="currentColor"/><circle cx="63" cy="50" r="5" fill="currentColor"/></svg>'
  };

  // Circular carousel: each card's place on the ring is its distance d from the front card, wrapped so the
  // ring has no ends (with 4 cards: d = -2, -1, 0, 1). Turning the ring just changes which card is in front.
  function carousel(grid) {
    const cards = [...grid.children], n = cards.length, pager = document.getElementById("pager");
    let front = 0;
    function place() {
      const narrow = innerWidth < 760;
      cards.forEach((c, i) => {
        const d = ((i - front + n + Math.floor(n / 2)) % n) - Math.floor(n / 2), a = Math.abs(d);
        const x = d * (narrow ? 78 : 70), behind = a >= 2;
        c.style.transform = `translateX(${behind ? 0 : x}%) translateZ(${-a * 160}px) rotateY(${-d * (narrow ? 0 : 28)}deg) scale(${behind ? .6 : 1 - a * .1})`;
        c.style.opacity = behind ? 0 : a ? .75 : 1;
        c.style.zIndex = 10 - a;
        c.style.pointerEvents = behind ? "none" : "";
        c.classList.toggle("front", d === 0);
        c.tabIndex = d === 0 ? 0 : -1;
        c.setAttribute("aria-hidden", d !== 0);
      });
      [...pager.children].forEach((b, i) => b.setAttribute("aria-current", i === front));
    }
    const turn = (k) => { front = (front + k + n) % n; place(); };
    pager.innerHTML = "";
    cards.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-label", "Show " + c.querySelector("h2").textContent);
      b.onclick = () => { front = i; place(); };
      pager.appendChild(b);
      // A side card turns the ring to itself instead of opening; only the front card opens its platform.
      c.addEventListener("click", (e) => { if (i !== front) { e.preventDefault(); front = i; place(); } });
    });
    document.getElementById("prev").onclick = () => turn(-1);
    document.getElementById("next").onclick = () => turn(1);
    grid.parentElement.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") turn(-1); else if (e.key === "ArrowRight") turn(1); else return;
      e.preventDefault(); cards[front].focus({ preventScroll: true });
    });
    let x0 = null, swiped = false;  // swipe: a sideways drag of 40px or more turns the ring
    grid.addEventListener("pointerdown", (e) => { x0 = e.clientX; swiped = false; });
    grid.addEventListener("pointerup", (e) => {
      if (x0 !== null && Math.abs(e.clientX - x0) > 40) { swiped = true; turn(e.clientX < x0 ? 1 : -1); }
      x0 = null;
    });
    grid.addEventListener("click", (e) => { if (swiped) { e.preventDefault(); swiped = false; } }, true);
    addEventListener("resize", place);
    pager.hidden = n < 2;
    place();
  }

  fetch("platforms.json",{ cache: "no-cache" })  // always check for a newer card list (GitHub Pages lets browsers cache 10 min)
    .then(r => r.json())
    .then(cfg => {
      document.getElementById("footer").textContent = cfg.site.footer;
      const grid = document.getElementById("grid");
      if (!cfg.platforms.length) {
        grid.innerHTML = '<p class="empty">No platforms configured yet.</p>';
        return;
      }
      for (const p of cfg.platforms) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.url;
        a.style.setProperty("--c1", p.accent);
        a.style.setProperty("--c2", p.accent2);
        a.innerHTML = `
          <span class="wm">${WATERMARKS[p.watermark] || ""}</span>
          <div class="cardhead">
            <span class="appicon">${p.emoji}</span>
            <span class="pill">${p.field}</span>
          </div>
          <h2>${p.name}</h2>
          <p class="ctag">${p.tagline}</p>
          <hr>
          <ul>${p.bullets.map(b => `<li><span class="chk">✓</span>${b}</li>`).join("")}</ul>
          <span class="btn">Open platform <span class="arrow">→</span></span>`;
        grid.appendChild(a);
      }
      carousel(grid);
    })
    .catch(() => {
      document.getElementById("grid").innerHTML =
        '<p class="empty">Could not load platforms.json</p>';
    });
</script>
</body>
</html>

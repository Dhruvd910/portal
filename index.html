<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekurious — Aspirant Hub</title>
<meta name="description" content="Tekurious Aspirant Hub: one doorway to every exam platform — NEET Compass and JEE Workbench.">
<link rel="icon" type="image/svg+xml" href="tekurious.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #142B3F;
    --green: #4CAF50;
    --green-soft: #7BD389;
    --panel: rgba(255, 255, 255, .035);
    --border: rgba(255, 255, 255, .10);
    --text: #eaf1f8;
    --muted: #9fb0c3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 480px at -10% 108%, rgba(16, 185, 129, .22), transparent 65%),
      radial-gradient(800px 430px at 108% 104%, rgba(59, 130, 246, .20), transparent 65%),
      radial-gradient(700px 380px at 106% -12%, rgba(16, 185, 129, .12), transparent 60%),
      radial-gradient(620px 320px at -8% 42%, rgba(45, 212, 191, .07), transparent 60%),
      #0A1420;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ---------- decorative background ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-mono {
    position: absolute;
    top: -90px; right: -80px;
    width: 620px; height: 620px;
    opacity: .12;
    transform: rotate(8deg);
  }
  .dots {
    position: absolute;
    background-image: radial-gradient(rgba(255, 255, 255, .15) 1.6px, transparent 1.7px);
    background-size: 30px 30px;
  }
  .dots-1 { top: 70px; left: 250px; width: 230px; height: 165px; }
  .dots-2 { top: 56%; left: -10px; width: 165px; height: 230px; }
  .dots-3 { bottom: 8%; right: 12%; width: 165px; height: 120px; opacity: .6; }
  .wave {
    position: absolute;
    border-radius: 45%;
    filter: blur(2px);
  }
  .wave-green {
    bottom: -320px; left: -300px;
    width: 1000px; height: 560px;
    background: linear-gradient(120deg, rgba(16, 185, 129, .30), rgba(45, 212, 191, .05) 70%);
    transform: rotate(-8deg);
  }
  .wave-blue {
    bottom: -300px; right: -280px;
    width: 950px; height: 520px;
    background: linear-gradient(240deg, rgba(59, 130, 246, .28), rgba(37, 99, 235, .04) 70%);
    transform: rotate(7deg);
  }

  /* ---------- header ---------- */
  header { text-align: center; padding: 56px 20px 8px; }
  .brandlink { text-decoration: none; display: inline-block; }
  .logo {
    display: block;
    width: 68px; height: 68px;
    margin: 0 auto;
    padding: 9px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .10);
    transition: transform .18s ease;
  }
  .brandlink:hover .logo { transform: scale(1.06); }
  .brand {
    font-family: "Quicksand", ui-sans-serif, sans-serif;
    font-size: 1.06rem;
    font-weight: 700;
    letter-spacing: .48em;
    text-indent: .48em;
    text-transform: uppercase;
    color: var(--green);
    margin: 14px 0 4px;
  }
  .kicker {
    display: inline-block;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    margin: 10px 0 22px;
  }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  h1 .grad {
    background: linear-gradient(90deg, #22d3ee, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--muted); margin-top: 14px; font-size: 1.1rem; }
  .tagline a { color: var(--green-soft); text-decoration: none; }
  .tagline a:hover { text-decoration: underline; }
  .rule {
    width: 130px; height: 3px;
    margin: 20px auto 0;
    border-radius: 3px;
    background: linear-gradient(90deg, #22d3ee, #4ade80);
  }

  /* ---------- cards ---------- */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 32px;
    max-width: 1020px;
    width: 100%;
    margin: 44px auto;
    padding: 0 24px 20px;
    align-items: stretch;
  }
  a.card {
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 30px 30px 28px;
    border-radius: 22px;
    border: 1.5px solid color-mix(in srgb, var(--c1) 45%, transparent);
    background:
      radial-gradient(420px 190px at 100% 100%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 70%),
      linear-gradient(160deg, color-mix(in srgb, var(--c1) 9%, transparent), color-mix(in srgb, var(--c2) 5%, transparent) 60%, transparent),
      var(--panel);
    box-shadow: 0 20px 50px -20px color-mix(in srgb, var(--c1) 25%, transparent);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  a.card:hover {
    transform: translateY(-5px);
    border-color: color-mix(in srgb, var(--c1) 75%, transparent);
    box-shadow: 0 26px 60px -18px color-mix(in srgb, var(--c1) 40%, transparent);
  }
  .wm {
    position: absolute;
    top: -26px; right: -22px;
    width: 150px; height: 150px;
    color: color-mix(in srgb, var(--c1) 16%, transparent);
    pointer-events: none;
  }
  .wm svg { width: 100%; height: 100%; }
  .cardhead { display: flex; align-items: center; gap: 16px; }
  .appicon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px; height: 58px;
    font-size: 1.75rem;
    border-radius: 16px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 55%, white), var(--c1));
    box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--c1) 55%, transparent);
  }
  .pill {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--c1) 75%, white);
    border: 1px solid color-mix(in srgb, var(--c1) 45%, transparent);
    background: color-mix(in srgb, var(--c1) 10%, transparent);
    border-radius: 999px;
    padding: 8px 16px;
  }
  .card h2 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.01em; }
  .ctag { color: var(--muted); font-size: 1rem; }
  .card hr {
    border: none;
    border-top: 1px solid color-mix(in srgb, var(--c1) 22%, transparent);
    margin: 14px 0 6px;
  }
  .card ul { list-style: none; display: grid; gap: 13px; padding: 4px 0 8px; }
  .card li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #c6d3e2;
    font-size: .97rem;
  }
  .chk {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px; height: 21px;
    margin-top: 1px;
    border-radius: 50%;
    background: var(--c1);
    color: #06101c;
    font-size: .72rem;
    font-weight: 800;
  }
  .btn {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--c2), var(--c1));
    color: #07101d;
    font-weight: 800;
    font-size: 1rem;
    transition: filter .18s ease, transform .18s ease;
  }
  a.card:hover .btn { filter: brightness(1.1); }
  .btn .arrow { transition: transform .18s ease; }
  a.card:hover .btn .arrow { transform: translateX(4px); }

  /* ---------- footer ---------- */
  footer { display: flex; justify-content: center; padding: 8px 20px 34px; }
  .footerpill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: .85rem;
    background: rgba(255, 255, 255, .045);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 22px;
  }
  .logo-sm {
    width: 30px; height: 30px;
    padding: 4px;
    box-sizing: border-box;
    background: #F3F7F4;
    border-radius: 9px;
  }
  .wordmark-sm {
    font-family: "Quicksand", ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: .98rem;
    color: var(--green-soft);
    text-decoration: none;
  }
  .wordmark-sm:hover { color: var(--green); }
  .sep { color: var(--green); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }

  @media (max-width: 640px) {
    .dots-1, .dots-3 { display: none; }
    .bg-mono { width: 420px; height: 420px; opacity: .08; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <img class="bg-mono" src="tekurious.svg" alt="">
  <div class="dots dots-1"></div>
  <div class="dots dots-2"></div>
  <div class="dots dots-3"></div>
  <div class="wave wave-green"></div>
  <div class="wave wave-blue"></div>
</div>

<header>
  <a class="brandlink" href="https://tekurious.in" target="_blank" rel="noopener" title="tekurious.in">
    <img class="logo" src="tekurious.svg" alt="Tekurious logo">
    <div class="brand">Tekurious</div>
  </a>
  <span class="kicker">Aspirant Hub</span>
  <h1>Choose your <span class="grad">platform</span></h1>
  <p class="tagline">One doorway to every exam platform, by <a href="https://tekurious.in" target="_blank" rel="noopener">Tekurious</a></p>
  <div class="rule"></div>
</header>

<main class="grid" id="grid"></main>

<footer>
  <span class="footerpill">
    <img class="logo-sm" src="tekurious.svg" alt="">
    <a class="wordmark-sm" href="https://tekurious.in" target="_blank" rel="noopener">Tekurious</a>
    <span class="sep">•</span>
    <span id="footer"></span>
  </span>
</footer>

<script>
  const WATERMARKS = {
    cross: '<svg viewBox="0 0 100 100" fill="currentColor"><path d="M35 4 h30 a3 3 0 0 1 3 3 v25 h25 a3 3 0 0 1 3 3 v30 a3 3 0 0 1 -3 3 h-25 v25 a3 3 0 0 1 -3 3 h-30 a3 3 0 0 1 -3 -3 v-25 h-25 a3 3 0 0 1 -3 -3 v-30 a3 3 0 0 1 3 -3 h25 v-25 a3 3 0 0 1 3 -3 z"/></svg>',
    gear: '<svg viewBox="0 0 100 100" fill="currentColor"><g>' +
      [0,45,90,135,180,225,270,315].map(a =>
        '<rect x="44" y="2" width="12" height="26" rx="4" transform="rotate(' + a + ' 50 50)"/>' ).join("") +
      '</g><circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width="15"/></svg>'
  };

  fetch("platforms.json")
    .then(r => r.json())
    .then(cfg => {
      document.getElementById("footer").textContent = cfg.site.footer;
      const grid = document.getElementById("grid");
      if (!cfg.platforms.length) {
        grid.innerHTML = '<p class="empty">No platforms configured yet.</p>';
        return;
      }
      for (const p of cfg.platforms) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.url;
        a.style.setProperty("--c1", p.accent);
        a.style.setProperty("--c2", p.accent2);
        a.innerHTML = `
          <span class="wm">${WATERMARKS[p.watermark] || ""}</span>
          <div class="cardhead">
            <span class="appicon">${p.emoji}</span>
            <span class="pill">${p.field}</span>
          </div>
          <h2>${p.name}</h2>
          <p class="ctag">${p.tagline}</p>
          <hr>
          <ul>${p.bullets.map(b => `<li><span class="chk">✓</span>${b}</li>`).join("")}</ul>
          <span class="btn">Open platform <span class="arrow">→</span></span>`;
        grid.appendChild(a);
      }
    })
    .catch(() => {
      document.getElementById("grid").innerHTML =
        '<p class="empty">Could not load platforms.json</p>';
    });
</script>
</body>
</html>
